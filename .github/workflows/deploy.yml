# GitHub Pages 자동 배포
# main에 새 커밋이 올라오면: 테스트 → 빌드 → GitHub Pages(플레이 링크)에 올린다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # GitHub 웹에서 직접 다시 실행할 수도 있게 한다

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 먼저 시작한 것은 취소한다
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci # package-lock.json에 적힌 버전 그대로 설치
      - run: npm test # 규칙 테스트가 하나라도 실패하면 배포하지 않는다
      - run: npm run build
        env:
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }} # 화면이 접속할 게임 서버 주소 (저장소 변수)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
